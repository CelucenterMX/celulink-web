<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofertas · Celulink de CeluCenter</title>
  <link rel="icon" href="../assets/icono-celucenter.png">
  <style>
    :root {
      --celeste: #0ea5e9;
      --celeste-oscuro: #0369a1;
      --color-bg: #f8fafc;
      --color-borde: #e2e8f0;
      --color-texto-suave: #64748b;
      --radius-lg: 16px;
      --radius-pill: 999px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--color-bg); color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #fff; border-bottom: 1px solid var(--color-borde); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header a { text-decoration: none; color: var(--celeste-oscuro); font-weight: 600; font-size: 0.9rem; }
    header a:hover { text-decoration: underline; }
    .spacer { flex: 1; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .card {
      max-width: 600px; width: 100%;
      background: #fff;
      border: 2px dashed var(--color-borde);
      border-radius: var(--radius-lg);
      padding: 56px 40px;
      text-align: center;
    }
    .emoji { font-size: 3.5rem; margin-bottom: 20px; }
    h1 { font-size: 1.7rem; color: var(--celeste-oscuro); margin-bottom: 12px; }
    p { color: var(--color-texto-suave); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 11px 28px;
      background: var(--celeste);
      color: #fff;
      text-decoration: none;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 0.9rem;
      margin: 6px;
    }
    .btn-ghost {
      background: transparent;
      color: var(--celeste);
      border: 2px solid var(--celeste);
    }
    footer { text-align: center; padding: 20px; font-size: 0.8rem; color: var(--color-texto-suave); border-top: 1px solid var(--color-borde); }
  </style>
</head>
<body>

<header>
  <a href="../">← Celulink</a>
  <div class="spacer"></div>
  <a href="../catalogos/accesorios/">Gadgets</a>
  <a href="../catalogos/equipos/" style="margin-left:16px">Equipos</a>
</header>

<main>
  <div class="card">
    <div class="emoji">🏷️</div>
    <h1>Ofertas · Próximamente</h1>
    <p>
      Estamos preparando una sección de ofertas y promociones especiales.<br>
      Mientras tanto, explora nuestros catálogos o contáctanos por WhatsApp.
    </p>
    <a class="btn" href="../catalogos/accesorios/">Ver Gadgets</a>
    <a class="btn btn-ghost" href="https://wa.me/523413300001?text=Hola%2C%20me%20interesan%20las%20ofertas%20de%20Celulink" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</main>

<footer>© 2026 CeluCenter · Celulink.mx</footer>

</body>
</html>
