const DAYS_ES = ['Dom','Lun','Mar','Mi\u00e9','Jue','Vie','S\u00e1b'];
const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function dateRange(from, to) {
  const dates = [];
  const d = new Date(from + 'T12:00:00');
  const end = new Date(to + 'T12:00:00');
  while (d <= end) {
    dates.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate() + 1);
  }
  return dates;
}

function setPreset(days) {
  const to = new Date(DATA.maxDate + 'T12:00:00');
  const from = new Date(to);
  from.setDate(from.getDate() - days + 1);
  document.getElementById('dateFrom').value = from.toISOString().slice(0,10);
  document.getElementById('dateTo').value = DATA.maxDate;
  document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

document.querySelectorAll('.preset').forEach(p => {
  p.addEventListener('click', () => setPreset(parseInt(p.dataset.days)));
});

function render() {
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  if (!from || !to) return;

  const dates = dateRange(from, to);
  const totalDays = dates.length;

  // Calculate stats per store
  const stats = DATA.stores.map(store => {
    const c = DATA.counts[store] || {};
    let daysWithCot = 0;
    let totalCot = 0;
    const daily = dates.map(d => {
      const n = c[d] || 0;
      if (n > 0) daysWithCot++;
      totalCot += n;
      return n;
    });
    const pct = totalDays > 0 ? Math.round(daysWithCot / totalDays * 100) : 0;
    return { store, daily, daysWithCot, totalCot, pct };
  });

  // Sort by pct ascending (worst first)
  stats.sort((a, b) => a.pct - b.pct);

  // Summary
  const best = stats[stats.length - 1];
  const worst = stats[0];
  const bestStores = stats.filter(s => s.pct === best.pct).map(s => s.store);
  const worstStores = stats.filter(s => s.pct === worst.pct).map(s => s.store);

  document.getElementById('subtitle').textContent =
    `Per\u00edodo: ${from} al ${to} \u00b7 ${totalDays} d\u00edas \u00b7 ${DATA.stores.length} tiendas Celucenter`;

  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="card-title">Tiendas</div><div class="card-value">${DATA.stores.length}</div><div class="card-sub">Celucenter propias</div></div>
    <div class="card"><div class="card-title">Mejor tienda</div><div class="card-value">${best.pct}%</div><div class="card-sub">${bestStores.slice(0,2).join(' / ')}</div></div>
    <div class="card"><div class="card-title">Peor tienda</div><div class="card-value">${worst.pct}%</div><div class="card-sub">${worstStores.slice(0,2).join(' / ')}</div></div>
    <div class="card"><div class="card-title">D\u00edas</div><div class="card-value">${totalDays}</div><div class="card-sub">${from.slice(5)} — ${to.slice(5)}</div></div>
  `;

  // Build table
  let headerCells = dates.map(d => {
    const dt = new Date(d + 'T12:00:00');
    const dow = DAYS_ES[dt.getDay()];
    const day = dt.getDate();
    const mon = MONTHS_ES[dt.getMonth()];
    return `<th style="min-width:32px;font-size:10px;padding:3px 2px;text-align:center;border:1px solid rgba(255,255,255,.2)"><div>${dow}</div><div style="font-weight:bold">${day}</div><div style="color:rgba(255,255,255,.7)">${mon}</div></th>`;
  }).join('');

  let rows = stats.map(s => {
    const rowClass = s.pct < 40 ? 'row-bad' : s.pct < 70 ? 'row-ok' : 'row-good';
    const pctClass = s.pct < 40 ? 'pct-red' : s.pct < 70 ? 'pct-orange' : 'pct-green';
    const bg = rowClass === 'row-bad' ? '#fff3f3' : rowClass === 'row-good' ? '#f1f8e9' : '#fff';

    const cells = s.daily.map((n, i) => {
      const d = dates[i];
      if (n === 0) {
        return `<td title="${s.store} - ${d}: 0" class="cell cell-red">\u2717</td>`;
      } else if (n <= 2) {
        return `<td title="${s.store} - ${d}: ${n}" class="cell cell-green1">${n}</td>`;
      } else if (n <= 5) {
        return `<td title="${s.store} - ${d}: ${n}" class="cell cell-green2">${n}</td>`;
      } else {
        return `<td title="${s.store} - ${d}: ${n}" class="cell cell-green3">${n}</td>`;
      }
    }).join('');

    return `<tr class="${rowClass}">
      <td class="store-name" style="background:${bg}">${s.store}</td>
      <td style="text-align:center;padding:4px 8px;border:1px solid #ddd"><span class="pct-badge ${pctClass}">${s.pct}%</span></td>
      <td style="text-align:center;padding:4px 8px;font-size:11px;border:1px solid #ddd">${s.daysWithCot}/${totalDays}</td>
      <td style="text-align:center;padding:4px 8px;font-size:11px;border:1px solid #ddd">${s.totalCot}</td>
      ${cells}
    </tr>`;
  }).join('');

  document.getElementById('tableWrap').innerHTML = `
    <table>
      <thead><tr>
        <th style="min-width:140px;text-align:left;padding:8px 10px">Tienda</th>
        <th style="min-width:55px">% D\u00edas</th>
        <th style="min-width:55px">D\u00edas cot.</th>
        <th style="min-width:55px">Total</th>
        ${headerCells}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// Initialize with last 30 days

const initFrom = new Date(maxDate);
initFrom.setDate(initFrom.getDate() - 29);
document.getElementById('dateFrom').value = initFrom.toISOString().slice(0,10);

document.getElementById('dateTo').min = DATA.minDate;
document.getElementById('dateTo').max = DATA.maxDate;
render();
</script>
