<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marca Celulink — Activos de Imagen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 32px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header img { height: 64px; width: auto; margin-bottom: 16px; }
    header h1 { font-size: 22px; font-weight: 700; color: #fff; }
    header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .card-img {
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 180px;
      overflow: hidden;
      cursor: zoom-in;
    }
    .card-img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.2s;
    }
    .card-img:hover img { transform: scale(1.04); }

    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-name {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      word-break: break-word;
    }
    .card-filename {
      font-size: 10px;
      color: #64748b;
      font-family: monospace;
    }

    .btn-dl {
      display: block;
      text-align: center;
      background: #0ea5e9;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: auto;
      transition: background 0.15s;
    }
    .btn-dl:hover { background: #0284c7; }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    #lightbox-close {
      position: fixed;
      top: 20px; right: 24px;
      font-size: 28px;
      color: #fff;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

<header>
  <img src="../../assets/marca/logo-color-fondo-blanco.jpeg" alt="Celulink">
  <h1>Activos de Imagen — Celulink</h1>
  <p>Haz clic en la imagen para ver en tamaño completo · Botón azul para descargar</p>
</header>

<div class="grid" id="galeria"></div>

<!-- Lightbox -->
<div id="lightbox">
  <span id="lightbox-close" onclick="cerrarLightbox()">✕</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const archivos = [
    { file: 'logo-color-fondo-blanco.jpeg',          nombre: 'Logo color · fondo blanco' },
    { file: 'logo-color-fondo-oscuro-v1.jpeg',       nombre: 'Logo color · fondo oscuro v1' },
    { file: 'logo-color-fondo-oscuro-v2.jpeg',       nombre: 'Logo color · fondo oscuro v2' },
    { file: 'logo-color-fondo-oscuro-v3.jpeg',       nombre: 'Logo color · fondo oscuro v3' },
    { file: 'logo-color-fondo-oscuro-rojo.jpeg',     nombre: 'Logo color · fondo oscuro rojo' },
    { file: 'logo-monocromatico-beige.jpeg',         nombre: 'Logo monocromático · beige' },
    { file: 'logo-lineal-beige-wide.jpeg',           nombre: 'Logo lineal · beige wide' },
    { file: 'icono-solo-rojo.jpeg',                  nombre: 'Ícono solo · rojo' },
    { file: 'icono-solo-rojo-v2.jpeg',               nombre: 'Ícono solo · rojo v2' },
    { file: 'banner-oscuro-conectando-corazones.jpeg', nombre: 'Banner oscuro · Conectando Corazones' },
    { file: 'banner-claro-conectando-corazones.jpeg',  nombre: 'Banner claro · Conectando Corazones' },
    { file: 'variantes-blanco-negro.jpeg',           nombre: 'Variantes blanco y negro' },
    { file: 'sistema-aplicaciones-marca.jpeg',       nombre: 'Sistema de aplicaciones de marca' },
    { file: 'vale-de-descuento.jpeg',                nombre: 'Vale de descuento' },
  ];

  const base = '../../assets/marca/';
  const galeria = document.getElementById('galeria');

  archivos.forEach(({ file, nombre }) => {
    const src = base + file;
    galeria.innerHTML += `
      <div class="card">
        <div class="card-img" onclick="abrirLightbox('${src}')">
          <img src="${src}" alt="${nombre}" loading="lazy">
        </div>
        <div class="card-body">
          <div class="card-name">${nombre}</div>
          <div class="card-filename">${file}</div>
          <a class="btn-dl" href="${src}" download="${file}">⬇ Descargar</a>
        </div>
      </div>`;
  });

  function abrirLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function cerrarLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
  }
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) cerrarLightbox();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarLightbox(); });
</script>

</body>
</html>
